[project]
name = "tavi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.2",
    "fastapi>=0.115.0",
    "geopandas>=1.1.3",
    "langchain-anthropic>=1.4.2",
    "langchain-core>=1.3.2",
    "langgraph>=1.1.10",
    "lyra-api",
    "pandas>=3.0.2",
    "psycopg2>=2.9.12",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
    "tabulate>=0.10.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = ["httpx>=0.28.0", "ipykernel<7", "pre-commit>=4.6.0"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tavi"]

[tool.uv.sources]
lyra-api = { git = "https://github.com/RodolfoFigueroa/lyra", subdirectory = "packages/lyra_api", branch = "dev" }
